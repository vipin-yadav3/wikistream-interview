version: "3.8"

# Full stack: Kafka (KRaft) + Postgres 15 + MinIO (S3-compatible)
# All Spark jobs run locally via pip-installed PySpark.

services:

  # ── Kafka (no Zookeeper) ────────────────────────────────────────────────────
  kafka:
    image: bitnami/kafka:3.7
    container_name: wiki-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_CFG_LOG_RETENTION_HOURS=4
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 8

  # Create Kafka topics after broker is ready
  kafka-init:
    image: bitnami/kafka:3.7
    container_name: wiki-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
         --topic wiki.recentchanges --partitions 3 --replication-factor 1 &&
       kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
         --topic wiki.en-only --partitions 1 --replication-factor 1 &&
       echo 'Topics ready.'"
    restart: "no"

  # ── Postgres 15 ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: wiki-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB:       wikidb
      POSTGRES_USER:     wiki
      POSTGRES_PASSWORD: wiki
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki -d wikidb"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── MinIO (S3-compatible object store) ──────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: wiki-minio
    ports:
      - "9000:9000"   # S3 API endpoint
      - "9001:9001"   # Web console → http://localhost:9001
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Create the S3 bucket after MinIO is healthy
  minio-init:
    image: minio/mc:latest
    container_name: wiki-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "mc alias set local http://minio:9000 minioadmin minioadmin &&
       mc mb --ignore-existing local/wiki-stream &&
       echo 'Bucket wiki-stream ready.'"
    restart: "no"
