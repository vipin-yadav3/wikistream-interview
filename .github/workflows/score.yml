name: Auto-Score Candidate Solution

# Triggers on any push — works for both:
#   • Per-candidate repos (candidate pushes to main)
#   • Shared repo (candidate pushes to solution/<name> branch)
on:
  push:
    branches:
      - 'main'
      - 'solution/**'

permissions:
  contents: read       # read-only on the candidate repo — score is posted elsewhere

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Set up Java 17 (required for PySpark)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Sanitise branch name (replace / with - for artifact name)
        id: branch
        run: echo "safe=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - name: Cache Spark JARs (speeds up repeated runs)
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: spark-jars-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: |
          pip install --quiet \
            pyspark==3.5.3 \
            delta-spark==3.2.0 \
            pandas==2.2.3 \
            pyarrow==17.0.0 \
            psycopg2-binary==2.9.9 \
            pytest==8.3.3

      - name: Run automated scorer
        id: score
        run: |
          export PYSPARK_SUBMIT_ARGS="--packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,io.delta:delta-spark_2.12:3.2.0,org.postgresql:postgresql:42.7.3 pyspark-shell"
          python score_auto.py 2>&1 | tee score_output.txt

      # ── Score is posted ONLY to the private interviewer repo ─────────────────
      # Candidates have NO access to wikistream-interviewer — they never see this.
      # Requires secret INTERVIEWER_REPO_TOKEN (see README for setup instructions).
      - name: Post score as Issue in private interviewer repo
        uses: actions/github-script@v7
        if: always()
        env:
          INTERVIEWER_TOKEN: ${{ secrets.INTERVIEWER_REPO_TOKEN }}
        with:
          github-token: ${{ secrets.INTERVIEWER_REPO_TOKEN }}
          script: |
            if (!process.env.INTERVIEWER_TOKEN) {
              console.log('INTERVIEWER_REPO_TOKEN secret not set — skipping issue creation.');
              console.log('See README for one-time setup instructions.');
              return;
            }

            const fs = require('fs');
            const output = fs.readFileSync('score_output.txt', 'utf8');
            const branch = context.ref.replace('refs/heads/', '');
            const candidate = branch.replace('solution/', '').replace(/-/g, ' ')
                                    .replace(/\b\w/g, c => c.toUpperCase());

            let json = {};
            try { json = JSON.parse(fs.readFileSync('score_report.json', 'utf8')); } catch {}

            const auto    = json.automated ?? '?';
            const maxAuto = 62;
            const verdict = json.verdict || 'unknown';
            const emoji   = verdict === 'AUTO_PASS' ? '✅' : '⚠️';
            const sha7    = context.sha.substring(0, 7);
            const runUrl  = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              `## ${emoji} ${candidate} — Automated Score: ${auto}/${maxAuto}`,
              ``,
              `| Field | Value |`,
              `|---|---|`,
              `| **Candidate** | ${candidate} |`,
              `| **Branch** | \`${branch}\` |`,
              `| **Commit** | \`${sha7}\` |`,
              `| **Automated score** | ${auto} / ${maxAuto} |`,
              `| **Auto verdict** | ${verdict} |`,
              `| **Actions run** | [View logs](${runUrl}) |`,
              ``,
              `### Next step`,
              `Run on your machine to complete the manual portion:`,
              `\`\`\`bash`,
              `make score-branch BRANCH=${branch}`,
              `\`\`\``,
              ``,
              `<details><summary>Full automated test breakdown</summary>`,
              ``,
              `\`\`\``,
              output,
              `\`\`\``,
              `</details>`,
            ].join('\n');

            await github.rest.issues.create({
              owner: 'vipin-yadav3',
              repo:  'wikistream-interviewer',
              title: `${emoji} Score: ${candidate} — ${auto}/${maxAuto} (${verdict})`,
              body,
              labels: [verdict === 'AUTO_PASS' ? 'auto-pass' : 'auto-fail'],
            });

            console.log(`Score posted as issue in wikistream-interviewer`);
